<svg viewBox="0 0 1085 830" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="19">
  <!-- Geometry transcribed verbatim from the vector paths of Fig. 5.1 (p. 172) of the thesis,
       transformed by (x,y) -> ((x-50)*2.2, (y-55)*2.2). Only stroke/fill styling differs, to
       match the other figures in this documentation set.

       In the original, the image planes and the conics are painted with an OPAQUE white fill on
       top of the shaded epipolar region, which is what makes that region look notched. Here the
       fills are translucent for theming, so the same occlusion is reproduced with masks. -->
  <defs>
    <mask id="kt-pi-mask">
      <rect x="0" y="0" width="1085" height="830" fill="#fff"/>
      <path d="M 458.9,123.2 L 594.4,123.2 L 872.5,316.8 L 173.8,318.1 L 458.9,123.2 Z" fill="#000"/>
    </mask>
    <mask id="kt-plane-mask">
      <rect x="0" y="0" width="1085" height="830" fill="#fff"/>
      <path d="M 173.8,318.1 L 258.3,260.0 L 328.7,319.9 L 173.8,318.1 Z" fill="#000"/><path d="M 876.5,317.7 L 792.0,259.6 L 721.6,319.4 L 876.5,317.7 Z" fill="#000"/>
    </mask>
    <mask id="kt-region-mask">
      <rect x="0" y="0" width="1085" height="830" fill="#fff"/>
      <path d="M 211.2,116.6 L 367.8,217.4 L 367.8,437.4 L 211.2,336.6 L 211.2,116.6 Z" fill="#000"/><path d="M 834.2,116.6 L 677.6,217.4 L 677.6,437.4 L 834.2,336.6 L 834.2,116.6 Z" fill="#000"/>
      <path d="M 563.8,53.7 C 583.5,69.6 583.5,95.4 563.8,111.3 C 544.0,127.2 512.0,127.2 492.2,111.3 C 472.5,95.4 472.5,69.6 492.2,53.7 C 512.0,37.8 544.0,37.8 563.8,53.7 Z" fill="#000"/>
      <path d="M 173.8,318.1 L 258.3,260.0 L 328.7,319.9 L 173.8,318.1 Z" fill="#000"/><path d="M 876.5,317.7 L 792.0,259.6 L 721.6,319.4 L 876.5,317.7 Z" fill="#000"/>
    </mask>
    <mask id="kt-wedgeL-mask">
      <rect x="0" y="0" width="1085" height="830" fill="#fff"/>
      <path d="M 351.7,247.9 C 357.0,272.7 340.7,292.6 315.3,292.4 C 289.9,292.2 265.1,272.0 259.9,247.2 C 254.6,222.3 270.9,202.4 296.3,202.6 C 321.7,202.8 346.5,223.0 351.7,247.9 Z" fill="#000"/>
    </mask>
    <mask id="kt-wedgeR-mask">
      <rect x="0" y="0" width="1085" height="830" fill="#fff"/>
      <path d="M 749.5,202.9 C 774.8,201.3 792.2,220.3 788.4,245.4 C 784.5,270.5 760.9,292.1 735.6,293.7 C 710.3,295.3 692.9,276.3 696.7,251.2 C 700.6,226.2 724.2,204.6 749.5,202.9 Z" fill="#000"/>
    </mask>
  </defs>

  <!-- ================= TOP: 3D perspective ================= -->

  <!-- world plane pi (behind the shaded region) -->
  <path d="M 418.0,11.0 L 638.0,11.0 L 638.0,231.0 L 418.0,231.0 Z" fill="none" stroke="#1f2937" stroke-width="1.8" mask="url(#kt-pi-mask)"/>
  <text x="424.6" y="38.8" fill="#1f2937">&#960;</text>

  <!-- shaded epipolar region: the cone spanned by O, O' and the world conic Cw. Its bottom edge
       IS the baseline O-O'; its top edge is the chord where the cone grazes Cw. -->
  <path d="M 458.9,123.2 L 594.4,123.2 L 872.5,316.8 L 173.8,318.1 L 458.9,123.2 Z" fill="#1f2937" fill-opacity="0.12" stroke="#1f2937" stroke-width="1.8" mask="url(#kt-region-mask)"/>

  <!-- image planes, drawn over the shaded region -->
  <path d="M 211.2,116.6 L 367.8,217.4 L 367.8,437.4 L 211.2,336.6 L 211.2,116.6 Z" fill="#1f2937" fill-opacity="0.05" stroke="#1f2937" stroke-width="1.8" mask="url(#kt-plane-mask)"/>
  <path d="M 834.2,116.6 L 677.6,217.4 L 677.6,437.4 L 834.2,336.6 L 834.2,116.6 Z" fill="#1f2937" fill-opacity="0.05" stroke="#1f2937" stroke-width="1.8" mask="url(#kt-plane-mask)"/>
  <text x="242.0" y="192.8" fill="#1f2937">C</text>
  <text x="774.4" y="192.8" fill="#1f2937">C&#8217;</text>

  <!-- tangent wedges O-(tangent point on C)-e and O'-(tangent point on C')-e' -->
  <path d="M 173.8,318.1 L 258.3,260.0 L 328.7,319.9 L 173.8,318.1 Z" fill="#1f2937" fill-opacity="0.12" stroke="#1f2937" stroke-width="1.8" mask="url(#kt-wedgeL-mask)"/>
  <path d="M 876.5,317.7 L 792.0,259.6 L 721.6,319.4 L 876.5,317.7 Z" fill="#1f2937" fill-opacity="0.12" stroke="#1f2937" stroke-width="1.8" mask="url(#kt-wedgeR-mask)"/>

  <!-- world conic Cw on plane pi, and the two image conics C, C' -->
  <path d="M 563.8,53.7 C 583.5,69.6 583.5,95.4 563.8,111.3 C 544.0,127.2 512.0,127.2 492.2,111.3 C 472.5,95.4 472.5,69.6 492.2,53.7 C 512.0,37.8 544.0,37.8 563.8,53.7 Z" fill="none" stroke="#1f2937" stroke-width="1.8"/>
  <text x="569.8" y="58.6" fill="#1f2937">C<tspan x="584.5" y="60.3" font-size="13">W</tspan></text>
  <path d="M 351.7,247.9 C 357.0,272.7 340.7,292.6 315.3,292.4 C 289.9,292.2 265.1,272.0 259.9,247.2 C 254.6,222.3 270.9,202.4 296.3,202.6 C 321.7,202.8 346.5,223.0 351.7,247.9 Z" fill="none" stroke="#1f2937" stroke-width="1.8"/>
  <path d="M 749.5,202.9 C 774.8,201.3 792.2,220.3 788.4,245.4 C 784.5,270.5 760.9,292.1 735.6,293.7 C 710.3,295.3 692.9,276.3 696.7,251.2 C 700.6,226.2 724.2,204.6 749.5,202.9 Z" fill="none" stroke="#1f2937" stroke-width="1.8"/>

  <!-- epipolar lines cutting across each image plane, through its epipole -->
  <path d="M 369.2,356.8 L 210.8,219.6 Z" fill="none" stroke="#dc2626" stroke-width="1.1"/>
  <path d="M 677.6,357.3 L 836.0,220.0 Z" fill="none" stroke="#dc2626" stroke-width="1.1"/>

  <!-- camera centres and epipoles, all collinear on the baseline -->
  <circle cx="173.8" cy="318.1" r="5" fill="#1f2937"/>
  <text x="147.4" y="318.2" fill="#1f2937">O</text>
  <circle cx="876.5" cy="317.7" r="5" fill="#1f2937"/>
  <text x="891.0" y="318.2" fill="#1f2937">O&#8217;</text>
  <circle cx="328.7" cy="319.9" r="4.5" fill="#059669"/>
  <text x="335.0" y="311.0" fill="#059669">e</text>
  <circle cx="721.6" cy="319.4" r="4.5" fill="#059669"/>
  <text x="715.0" y="311.0" fill="#059669" text-anchor="end">e&#8217;</text>

  <!-- ================= BOTTOM: flat close-up of each image plane ================= -->
  <path d="M 19.8,479.6 L 451.0,479.6 L 451.0,814.0 L 19.8,814.0 Z" fill="none" stroke="#1f2937" stroke-width="1.8"/>
  <path d="M 259.4,580.2 C 306.6,614.5 306.6,670.3 259.4,704.6 C 212.1,739.0 135.5,739.0 88.2,704.6 C 41.0,670.3 41.0,614.5 88.2,580.2 C 135.5,545.8 212.1,545.8 259.4,580.2 Z" fill="none" stroke="#1f2937" stroke-width="1.8"/>
  <path d="M 198.9,524.0 L 418.9,726.4 Z" fill="none" stroke="#dc2626" stroke-width="1.6"/>
  <path d="M 96.8,733.5 L 415.4,724.7 Z" fill="none" stroke="#dc2626" stroke-width="1.6"/>
  <text x="88.0" y="553.6" fill="#1f2937">C</text>
  <text x="341.0" y="626.2" fill="#dc2626">l<tspan x="346.1" y="627.9" font-size="13">1</tspan></text>
  <text x="277.2" y="760.4" fill="#dc2626">l<tspan x="282.3" y="762.1" font-size="13">2</tspan></text>
  <circle cx="416.9" cy="724.7" r="4.5" fill="#059669"/>
  <text x="426.8" y="709.8" fill="#059669">e</text>

  <path d="M 635.8,479.6 L 1067.0,479.6 L 1067.0,814.0 L 635.8,814.0 Z" fill="none" stroke="#1f2937" stroke-width="1.8"/>
  <path d="M 828.3,579.7 C 781.1,614.1 781.1,669.8 828.3,704.2 C 875.6,738.5 952.2,738.5 999.4,704.2 C 1046.7,669.8 1046.7,614.1 999.4,579.7 C 952.2,545.4 875.6,545.4 828.3,579.7 Z" fill="none" stroke="#1f2937" stroke-width="1.8"/>
  <path d="M 888.8,523.6 L 668.8,726.0 Z" fill="none" stroke="#dc2626" stroke-width="1.6"/>
  <path d="M 990.9,733.0 L 672.3,724.2 Z" fill="none" stroke="#dc2626" stroke-width="1.6"/>
  <text x="979.0" y="553.6" fill="#1f2937">C&#8217;</text>
  <text x="737.0" y="626.2" fill="#dc2626">l&#8217;<tspan x="747.6" y="627.9" font-size="13">1</tspan></text>
  <text x="785.4" y="760.4" fill="#dc2626">l&#8217;<tspan x="796.0" y="762.1" font-size="13">2</tspan></text>
  <circle cx="670.8" cy="724.2" r="4.5" fill="#059669"/>
  <text x="651.2" y="709.8" fill="#059669" text-anchor="end">e&#8217;</text>
</svg>
