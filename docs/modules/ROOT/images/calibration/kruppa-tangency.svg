<svg viewBox="0 0 760 660" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="16">
  <!-- world plane pi with world conic Cw -->
  <rect x="290" y="20" width="180" height="130" fill="none" stroke="#1f2937" stroke-width="1.6"/>
  <text x="296" y="15" fill="#1f2937">&#960;</text>
  <ellipse cx="390" cy="80" rx="55" ry="35" fill="none" stroke="#1f2937" stroke-width="1.6"/>
  <text x="450" y="75" fill="#1f2937">C&#8348;</text>

  <!-- shaded visibility region connecting the world plane to both camera planes -->
  <polygon points="150,240 290,150 470,150 610,240 470,260 290,260" fill="#1f2937" fill-opacity="0.07" stroke="none"/>

  <!-- camera centers -->
  <circle cx="90" cy="430" r="5" fill="#1f2937"/>
  <text x="68" y="452" fill="#1f2937">O</text>
  <circle cx="670" cy="410" r="5" fill="#1f2937"/>
  <text x="682" y="432" fill="#1f2937">O&#8242;</text>
  <line x1="90" y1="430" x2="670" y2="410" stroke="#1f2937" stroke-width="2"/>
  <text x="345" y="452" fill="#1f2937" font-size="14">baseline</text>

  <!-- left image plane R with image conic C, same tilted-quadrilateral style as the epipolar-geometry figure -->
  <polygon points="240,150 345,220 300,420 195,330" fill="#1f2937" fill-opacity="0.06" stroke="#1f2937" stroke-width="1.6"/>
  <text x="255" y="140" fill="#1f2937">C</text>
  <ellipse cx="270" cy="270" rx="40" ry="40" fill="none" stroke="#1f2937" stroke-width="1.6"/>

  <line x1="90" y1="430" x2="240" y2="150" stroke="#1f2937" stroke-width="1.2"/>
  <line x1="90" y1="430" x2="345" y2="220" stroke="#1f2937" stroke-width="1.2"/>
  <line x1="90" y1="430" x2="300" y2="420" stroke="#1f2937" stroke-width="1.2"/>
  <line x1="90" y1="430" x2="195" y2="330" stroke="#1f2937" stroke-width="1.2"/>

  <!-- epipole e, on the baseline; tangent wedge computed from e to the conic (real tangent lines) -->
  <circle cx="305" cy="372" r="4.5" fill="#059669"/>
  <text x="313" y="367" fill="#059669">e</text>
  <polygon points="305,372 309.95,271.98 239.68,296.09" fill="#1f2937" fill-opacity="0.14" stroke="#1f2937" stroke-width="1.3"/>
  <text x="290" y="300" fill="#374151" font-size="13">l&#8321;</text>
  <text x="255" y="345" fill="#374151" font-size="13">l&#8322;</text>

  <!-- right image plane R' with image conic C', mirrored -->
  <polygon points="520,150 415,220 460,420 565,330" fill="#1f2937" fill-opacity="0.06" stroke="#1f2937" stroke-width="1.6"/>
  <text x="490" y="140" fill="#1f2937">C&#8242;</text>
  <ellipse cx="490" cy="270" rx="40" ry="40" fill="none" stroke="#1f2937" stroke-width="1.6"/>

  <line x1="670" y1="410" x2="520" y2="150" stroke="#1f2937" stroke-width="1.2"/>
  <line x1="670" y1="410" x2="415" y2="220" stroke="#1f2937" stroke-width="1.2"/>
  <line x1="670" y1="410" x2="460" y2="420" stroke="#1f2937" stroke-width="1.2"/>
  <line x1="670" y1="410" x2="565" y2="330" stroke="#1f2937" stroke-width="1.2"/>

  <circle cx="455" cy="372" r="4.5" fill="#059669"/>
  <text x="430" y="367" fill="#059669" text-anchor="end">e&#8242;</text>
  <polygon points="455,372 450.05,271.98 520.32,296.09" fill="#1f2937" fill-opacity="0.14" stroke="#1f2937" stroke-width="1.3"/>
  <text x="460" y="300" fill="#374151" font-size="13">l&#8242;&#8321;</text>
  <text x="495" y="345" fill="#374151" font-size="13">l&#8242;&#8322;</text>

  <!-- ============ bottom: flat close-ups with real tangent lines from e ============ -->
  <rect x="60" y="460" width="290" height="180" fill="none" stroke="#1f2937" stroke-width="1.6"/>
  <text x="70" y="480" fill="#1f2937">C</text>
  <ellipse cx="195" cy="545" rx="70" ry="45" fill="none" stroke="#1f2937" stroke-width="1.6"/>
  <circle cx="325" cy="565" r="4.5" fill="#1f2937"/>
  <text x="331" y="588" fill="#1f2937">e</text>
  <line x1="325" y1="565" x2="240.83" y2="492.09" stroke="#374151" stroke-width="1.8"/>
  <text x="243" y="485" fill="#374151" font-size="14">l&#8321;</text>
  <line x1="325" y1="565" x2="222.81" y2="609.24" stroke="#374151" stroke-width="1.8"/>
  <text x="200" y="622" fill="#374151" font-size="14">l&#8322;</text>

  <rect x="410" y="460" width="290" height="180" fill="none" stroke="#1f2937" stroke-width="1.6"/>
  <text x="420" y="480" fill="#1f2937">C&#8242;</text>
  <ellipse cx="565" cy="545" rx="70" ry="45" fill="none" stroke="#1f2937" stroke-width="1.6"/>
  <circle cx="435" cy="565" r="4.5" fill="#1f2937"/>
  <text x="405" y="588" fill="#1f2937" text-anchor="end">e&#8242;</text>
  <line x1="435" y1="565" x2="519.17" y2="492.09" stroke="#374151" stroke-width="1.8"/>
  <text x="512" y="485" fill="#374151" font-size="14">l&#8242;&#8321;</text>
  <line x1="435" y1="565" x2="537.19" y2="609.24" stroke="#374151" stroke-width="1.8"/>
  <text x="555" y="622" fill="#374151" font-size="14">l&#8242;&#8322;</text>
</svg>
