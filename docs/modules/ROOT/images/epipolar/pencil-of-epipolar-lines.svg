<svg viewBox="0 0 1480 940" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="16">
  <!-- a background stack of four large epipolar planes (Πe), unfilled, each sharing C and C' as two of
       its own corners so the baseline (and therefore both epipoles) lies exactly on every plane's edge -->
  <g fill="none" stroke="#9ca3af" stroke-width="1.1">
    <polygon points="70,590 441,99 1354,19 830,680"/>
    <polygon points="70,590 466,179 1370,157 830,680"/>
    <polygon points="70,590 469,274 1386,297 830,680"/>
    <polygon points="70,590 473,372 1402,437 830,680"/>
  </g>
  <text x="1220" y="55" fill="#6b7280" font-size="14">&#928;e (pencil of epipolar planes)</text>

  <!-- baseline C-C': the shared edge of every epipolar plane, passing through both epipoles -->
  <line x1="70" y1="590" x2="830" y2="680" stroke="#1f2937" stroke-width="2"/>
  <text x="430" y="662" fill="#1f2937" font-size="14">baseline</text>

  <!-- ================= LEFT VIEW ================= -->
  <!-- image plane R: tilted quadrilateral -->
  <polygon points="179,265 353,624 359,778 196,437" fill="#1f2937" fill-opacity="0.08" stroke="#1f2937" stroke-width="1.6"/>
  <text x="192" y="255" fill="#1f2937">R</text>

  <!-- frustum edges from C to the four corners of R -->
  <line x1="70" y1="590" x2="179" y2="265" stroke="#1f2937" stroke-width="1.3"/>
  <line x1="70" y1="590" x2="353" y2="624" stroke="#1f2937" stroke-width="1.3"/>
  <line x1="70" y1="590" x2="359" y2="778" stroke="#1f2937" stroke-width="1.3"/>
  <line x1="70" y1="590" x2="196" y2="437" stroke="#1f2937" stroke-width="1.3"/>

  <!-- camera center C -->
  <circle cx="70" cy="590" r="5" fill="#1f2937"/>
  <text x="48" y="612" fill="#1f2937">C</text>

  <!-- epipole e, on the baseline -->
  <circle cx="353" cy="624" r="4.5" fill="#059669"/>
  <text x="361" y="619" fill="#059669">e</text>

  <!-- pencil of epipolar lines l, one per background plane, ALL fanning out from the single epipole e -->
  <line x1="353" y1="624" x2="182" y2="291" stroke="#dc2626" stroke-width="1.6"/>
  <line x1="353" y1="624" x2="186" y2="334" stroke="#dc2626" stroke-width="1.6"/>
  <line x1="353" y1="624" x2="190" y2="377" stroke="#dc2626" stroke-width="1.6"/>
  <line x1="353" y1="624" x2="194" y2="420" stroke="#dc2626" stroke-width="1.6"/>
  <text x="298" y="500" fill="#dc2626" font-size="14">l</text>

  <!-- ================= RIGHT VIEW ================= -->
  <!-- image plane R', seen frontally as a plain rectangle -->
  <rect x="550" y="557" width="433" height="250" fill="#1f2937" fill-opacity="0.05" stroke="#1f2937" stroke-width="1.6"/>
  <text x="900" y="549" fill="#1f2937">R&#8242;</text>

  <!-- frustum edges from C' to the four corners of R' -->
  <line x1="830" y1="680" x2="550" y2="557" stroke="#1f2937" stroke-width="1.3"/>
  <line x1="830" y1="680" x2="983" y2="557" stroke="#1f2937" stroke-width="1.3"/>
  <line x1="830" y1="680" x2="983" y2="807" stroke="#1f2937" stroke-width="1.3"/>
  <line x1="830" y1="680" x2="550" y2="807" stroke="#1f2937" stroke-width="1.3"/>

  <!-- camera center C' -->
  <circle cx="830" cy="680" r="5" fill="#1f2937"/>
  <text x="840" y="702" fill="#1f2937">C&#8242;</text>

  <!-- epipole e' -->
  <circle cx="565" cy="649" r="4.5" fill="#059669"/>
  <text x="543" y="644" fill="#059669" text-anchor="end">e&#8242;</text>

  <!-- pencil of epipolar lines l', one per background plane, ALL fanning out from the single epipole e' -->
  <line x1="565" y1="649" x2="983" y2="565" stroke="#dc2626" stroke-width="1.6"/>
  <line x1="565" y1="649" x2="983" y2="605" stroke="#dc2626" stroke-width="1.6"/>
  <line x1="565" y1="649" x2="983" y2="645" stroke="#dc2626" stroke-width="1.6"/>
  <line x1="565" y1="649" x2="983" y2="685" stroke="#dc2626" stroke-width="1.6"/>
  <text x="760" y="600" fill="#dc2626" font-size="14">l&#8242;</text>

  <text x="90" y="890" fill="#374151" font-size="13">Every epipolar plane still contains the baseline, so on each view every one of its epipolar lines still passes</text>
  <text x="90" y="908" fill="#374151" font-size="13">through that view's single epipole -- a pencil of lines, all fanning out from e (or e&#8242;).</text>
</svg>
