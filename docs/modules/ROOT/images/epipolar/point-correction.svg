<svg viewBox="0 0 760 620" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="16">
  <!-- ============ TOP: 3D view, skewed (non-intersecting) rays ============ -->
  <circle cx="90" cy="380" r="5" fill="#1f2937"/>
  <text x="68" y="402" fill="#1f2937">C</text>
  <circle cx="670" cy="360" r="5" fill="#1f2937"/>
  <text x="682" y="382" fill="#1f2937">C&#8242;</text>
  <line x1="90" y1="380" x2="670" y2="360" stroke="#1f2937" stroke-width="2"/>
  <text x="345" y="402" fill="#1f2937" font-size="14">baseline</text>

  <!-- left plane + frustum -->
  <polygon points="240,110 345,175 300,370 195,290" fill="#1f2937" fill-opacity="0.06" stroke="#1f2937" stroke-width="1.6"/>
  <text x="255" y="100" fill="#1f2937">R</text>
  <line x1="90" y1="380" x2="240" y2="110" stroke="#1f2937" stroke-width="1.2"/>
  <line x1="90" y1="380" x2="345" y2="175" stroke="#1f2937" stroke-width="1.2"/>
  <line x1="90" y1="380" x2="300" y2="370" stroke="#1f2937" stroke-width="1.2"/>
  <line x1="90" y1="380" x2="195" y2="290" stroke="#1f2937" stroke-width="1.2"/>

  <!-- right plane + frustum -->
  <polygon points="520,110 415,175 460,370 565,290" fill="#1f2937" fill-opacity="0.06" stroke="#1f2937" stroke-width="1.6"/>
  <text x="490" y="100" fill="#1f2937">R&#8242;</text>
  <line x1="670" y1="360" x2="520" y2="110" stroke="#1f2937" stroke-width="1.2"/>
  <line x1="670" y1="360" x2="415" y2="175" stroke="#1f2937" stroke-width="1.2"/>
  <line x1="670" y1="360" x2="460" y2="370" stroke="#1f2937" stroke-width="1.2"/>
  <line x1="670" y1="360" x2="565" y2="290" stroke="#1f2937" stroke-width="1.2"/>

  <!-- epipoles, on the baseline -->
  <circle cx="305" cy="372" r="4.5" fill="#059669"/>
  <text x="313" y="368" fill="#059669">e</text>
  <circle cx="455" cy="372" r="4.5" fill="#059669"/>
  <text x="430" y="368" fill="#059669" text-anchor="end">e&#8242;</text>

  <!-- true epipolar lines l, l' (solid) inside each plane -->
  <line x1="305" y1="372" x2="235" y2="180" stroke="#dc2626" stroke-width="1.8"/>
  <text x="230" y="230" fill="#dc2626" font-size="14">l = Fm&#8242;</text>
  <line x1="455" y1="372" x2="525" y2="180" stroke="#dc2626" stroke-width="1.8"/>
  <text x="500" y="230" fill="#dc2626" font-size="14" text-anchor="end">l&#8242; = F&#7488;m</text>

  <!-- corrected points, exactly on the epipolar lines -->
  <circle cx="266" cy="266" r="4.5" fill="#059669"/>
  <text x="235" y="272" fill="#059669">m&#770;</text>
  <circle cx="494" cy="266" r="4.5" fill="#059669"/>
  <text x="502" y="272" fill="#059669">m&#770;&#8242;</text>

  <!-- measured points, slightly off the epipolar lines -->
  <circle cx="292" cy="252" r="4.5" fill="#1f2937"/>
  <text x="300" y="248" fill="#1f2937">m</text>
  <circle cx="468" cy="252" r="4.5" fill="#1f2937"/>
  <text x="440" y="248" fill="#1f2937" text-anchor="end">m&#8242;</text>
  <line x1="292" y1="252" x2="266" y2="266" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="2 3"/>
  <line x1="468" y1="252" x2="494" y2="266" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="2 3"/>

  <!-- SKEWED rays of light from C/C' through the MEASURED points, deliberately missing each other -->
  <line x1="90" y1="380" x2="292" y2="252" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="292" y1="252" x2="412" y2="178" stroke="#1f2937" stroke-width="1.6"/>
  <text x="140" y="330" fill="#374151" font-size="13" transform="rotate(-32 140 330)">ray of light</text>

  <line x1="670" y1="360" x2="468" y2="252" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="468" y1="252" x2="348" y2="190" stroke="#1f2937" stroke-width="1.6"/>
  <text x="610" y="330" fill="#374151" font-size="13" transform="rotate(32 610 330)">ray of light</text>

  <text x="345" y="165" fill="#374151" font-size="14">M?</text>
  <line x1="412" y1="178" x2="348" y2="190" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="3 3"/>

  <!-- ============ BOTTOM: flat 2D close-ups per view ============ -->
  <rect x="40" y="440" width="320" height="170" fill="none" stroke="#1f2937" stroke-width="1.6"/>
  <text x="350" y="458" fill="#1f2937" text-anchor="end">R</text>
  <line x1="60" y1="580" x2="340" y2="550" stroke="#dc2626" stroke-width="2"/>
  <text x="200" y="538" fill="#dc2626">l = F&#8202;m&#8242;</text>
  <circle cx="130" cy="495" r="4.5" fill="#1f2937"/>
  <text x="140" y="490" fill="#1f2937">m</text>
  <circle cx="150" cy="566" r="4.5" fill="#059669"/>
  <text x="150" y="586" fill="#059669">m&#770;</text>
  <circle cx="290" cy="556" r="4.5" fill="#059669"/>
  <text x="298" y="550" fill="#059669">e</text>
  <path d="M 130 495 L 138 513 L 150 566" fill="none" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="2 3"/>
  <path d="M 143 555 L 152 548 L 159 560" fill="none" stroke="#374151" stroke-width="1.2"/>

  <rect x="400" y="440" width="320" height="170" fill="none" stroke="#1f2937" stroke-width="1.6"/>
  <text x="410" y="458" fill="#1f2937">R&#8242;</text>
  <line x1="420" y1="550" x2="700" y2="580" stroke="#dc2626" stroke-width="2"/>
  <text x="520" y="538" fill="#dc2626">l&#8242; = F&#7488;m</text>
  <circle cx="630" cy="495" r="4.5" fill="#1f2937"/>
  <text x="600" y="490" fill="#1f2937" text-anchor="end">m&#8242;</text>
  <circle cx="610" cy="566" r="4.5" fill="#059669"/>
  <text x="590" y="586" fill="#059669" text-anchor="end">m&#770;&#8242;</text>
  <circle cx="450" cy="556" r="4.5" fill="#059669"/>
  <text x="425" y="550" fill="#059669">e&#8242;</text>
  <path d="M 630 495 L 622 513 L 610 566" fill="none" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="2 3"/>
  <path d="M 597 560 L 604 548 L 613 555" fill="none" stroke="#374151" stroke-width="1.2"/>
</svg>
